<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/camera-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photobooth Studio DS</title>
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('photobooth-theme'); } catch {}
        document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
          ? theme
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      })();
    </script>
    <!-- Google Fonts for stylish retro / clean korean photo strip typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-studio-950 text-studio-100 antialiased selection:bg-rose-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
